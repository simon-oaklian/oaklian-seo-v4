<main id="main">
  <div id="notif-container"></div>
  <div id="article-container"><div class="empty">加载中…</div></div>
</main>
<script src="/static/app.js"></script>
<script>
async function loadNotifications() {
  const box = document.getElementById('notif-container');
  try {
    const resp = await fetch('/api/notifications?status=unread', {credentials: 'same-origin'});
    if (!resp.ok) return;
    const data = await resp.json();
    if (!data.notifications || data.notifications.length === 0) {
      box.innerHTML = '';
      return;
    }
    box.innerHTML = data.notifications.map(n => {
      return '<a class="notif-card" data-id="' + n.id + '" href="' + (n.target_url || '#') + '">' +
        '<span class="notif-title">' + escape(n.title) + '</span>' +
        (n.body ? '<span class="notif-body">' + escape(n.body) + '</span>' : '') +
        '</a>';
    }).join('');
    box.querySelectorAll('.notif-card').forEach(el => {
      el.addEventListener('click', function(ev) {
        const id = this.getAttribute('data-id');
        try {
          const blob = new Blob([], {type: 'application/json'});
          navigator.sendBeacon('/api/notifications/' + id + '/read', blob);
        } catch (e) {
          fetch('/api/notifications/' + id + '/read', {method: 'POST', keepalive: true}).catch(() => {});
        }
      });
    });
  } catch (e) {
  }
}

async function loadArticles() {
  const main = document.getElementById('article-container');
  try {
    const data = await listArticles('pending');
    if (!data.articles || data.articles.length === 0) {
      main.innerHTML = '<div class="empty">暂无待审文章<br><br>点右上角「+ 新笔记」开始</div>';
      return;
    }
    main.innerHTML = data.articles.map(a => {
      const bizName = {oaklian:'Oaklian', jnono:'jnono', pricvo:'Pricvo'}[a.business] || a.business;
      const date = a.created_at ? a.created_at.slice(0,10) : '';
      return '<a class="card" href="/static/article.html?id=' + a.id + '">' +
        '<span class="' + bizClass(a.business) + '">' + bizName + '</span>' +
        '<span class="lang">' + a.language.toUpperCase() + '</span>' +
        '<div class="title">' + escape(a.title || '(无标题)') + '</div>' +
        '<div class="meta">#' + a.id + ' · ' + date + '</div>' +
        '</a>';
    }).join('');
  } catch (e) {
    showError(main, '加载失败: ' + e.message);
  }
}

loadNotifications();
loadArticles();
</script>
</body>
</html>
