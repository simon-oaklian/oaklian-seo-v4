<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SEO">
<link rel="manifest" href="/static/manifest.json">
<link rel="stylesheet" href="/static/app.css?v=2d61">
<title>小红书 - Oaklian</title>
<style>
.xhs-tabs{display:flex;gap:6px;padding:12px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.xhs-tabs::-webkit-scrollbar{display:none}
.xhs-tab{flex-shrink:0;padding:7px 16px;border:1px solid var(--border,#ddd);border-radius:18px;background:var(--card,#fff);font-size:13px;cursor:pointer;color:var(--fg,#333)}
.xhs-tab.on{background:#e91e63;color:#fff;border-color:#e91e63}
.xhs-card{background:var(--card,#fff);border:1px solid var(--border,#eee);border-radius:10px;padding:14px;margin:10px 16px;border-left:4px solid #ff9800}
.xhs-card.published{border-left-color:#4caf50}
.xhs-card.failed{border-left-color:#f44336}
.xhs-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.xhs-id{font-size:11px;color:#999}
.xhs-st{font-size:11px;padding:3px 10px;border-radius:10px;background:#fff3cd;color:#856404}
.xhs-st.published{background:#d4edda;color:#155724}
.xhs-st.failed{background:#f8d7da;color:#721c24}
.xhs-title{font-weight:600;font-size:15px;margin-bottom:6px;line-height:1.4}
.xhs-body{font-size:13px;color:#666;line-height:1.5;max-height:60px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;margin-bottom:8px}
.xhs-meta{font-size:11px;color:#999;margin-bottom:10px}
.xhs-acts{display:flex;gap:6px}
.xhs-btn{flex:1;padding:8px;border:none;border-radius:6px;font-size:12px;color:#fff;cursor:pointer}
.xhs-btn.v{background:#2196f3}
.xhs-btn.e{background:#ff9800}
.xhs-btn.p{background:#e91e63}
.xhs-empty{text-align:center;padding:50px 20px;color:#999}
.xhs-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;align-items:flex-end}
.xhs-modal.on{display:flex}
.xhs-mc{background:var(--card,#fff);width:100%;max-height:85vh;overflow-y:auto;border-radius:14px 14px 0 0;padding:18px}
.xhs-mc h3{margin:0 0 14px;font-size:16px}
.xhs-mc .row{margin-bottom:14px}
.xhs-mc .lbl{font-size:12px;color:#999;margin-bottom:4px}
.xhs-mc .val{font-size:14px;line-height:1.6;white-space:pre-wrap}
.xhs-close{width:100%;padding:12px;border:none;border-radius:8px;background:#eee;font-size:14px;margin-top:10px;cursor:pointer}
.xhs-tag{display:inline-block;background:#e91e63;color:#fff;padding:3px 10px;border-radius:10px;font-size:12px;margin:2px 4px 2px 0}


.xhs-actions{display:flex;gap:6px;align-items:center}
.xhs-icon-btn{
width:32px;height:30px;border:0;border-radius:8px;
background:rgba(255,255,255,.14);
display:inline-flex;align-items:center;justify-content:center;
cursor:pointer;color:#fff;
transition:.18s;
}
.xhs-icon-btn:hover{background:rgba(255,255,255,.18)}
.xhs-icon-btn svg{width:15px;height:15px;stroke-width:2}

</style>
</head>
<body>
<header>
  <h1>小红书</h1>
  
<div class="xhs-actions">

<button class="xhs-icon-btn" title="调研" onclick="openXhsTool('research')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
<circle cx="11" cy="11" r="7"></circle>
<line x1="21" y1="21" x2="16.65" y2="16.65"></line>
</svg>
</button>

<button class="xhs-icon-btn" title="内容生成" onclick="openXhsTool('content')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
<path d="M12 20h9"></path>
<path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
</svg>
</button>

<button class="xhs-icon-btn" title="发布中心" onclick="openXhsTool('publish')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
<path d="M12 3v12"></path>
<path d="m17 8-5-5-5 5"></path>
<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
</svg>
</button>

<button class="xhs-icon-btn" title="互动管理" onclick="openXhsTool('engage')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
</svg>
</button>

<button class="xhs-icon-btn" title="数据分析" onclick="openXhsTool('analytics')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
<line x1="18" y1="20" x2="18" y2="10"></line>
<line x1="12" y1="20" x2="12" y2="4"></line>
<line x1="6" y1="20" x2="6" y2="14"></line>
</svg>
</button>

<button class="xhs-icon-btn" title="账号管理" onclick="openXhsTool('account')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
<path d="M20 21a8 8 0 1 0-16 0"></path>
<circle cx="12" cy="7" r="4"></circle>
</svg>
</button>

<a class="xhs-icon-btn" href="javascript:history.back()" title="返回">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
<line x1="19" y1="12" x2="5" y2="12"></line>
<polyline points="12 19 5 12 12 5"></polyline>
</svg>
</a>

</div>

</header>
<main id="main">
  <div id="xhsTip" style="display:none;margin:12px 16px 0;padding:8px 10px;border-radius:8px;background:#fff;color:#555;font-size:12px;border:1px solid #eee;"></div>
  <div id="xhsAccount" style="margin:12px 16px 0;padding:10px 12px;border-radius:10px;background:#fff;border:1px solid #eee;font-size:12px;color:#555;"></div>
  <div id="xhsToolPanel" style="display:none;margin:10px 16px 0;padding:12px;border-radius:10px;background:#fff;border:1px solid #eee;"></div>
  <div class="xhs-tabs" id="tabs">
    <button class="xhs-tab on" data-s="">全部</button>
    <button class="xhs-tab" data-s="pending">待发布</button>
    <button class="xhs-tab" data-s="published">已发布</button>
    <button class="xhs-tab" data-s="failed">失败</button>
  </div>
  <div id="stats" style="padding:0 16px 8px;font-size:12px;color:#999;"></div>
  <div id="list"><div class="xhs-empty">加载中…</div></div>
</main>

<div class="xhs-modal" id="modal">
  <div class="xhs-mc" id="modalContent"></div>
</div>

<div id="imgViewer" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:2000;align-items:center;justify-content:center" onclick="closeImgViewer()">
  <img id="imgViewerImg" src="" style="max-width:96%;max-height:90%;object-fit:contain">
</div>

<script>
function showTool(ev,name){
  var btns=document.getElementsByClassName("xhs-tool");
  for(var i=0;i<btns.length;i++)btns[i].classList.remove("on");
  if(ev && ev.currentTarget)ev.currentTarget.classList.add("on");
  if(name!=="content") alert(name+" 模块下一步接入");
}
function xhsTip(msg){
  var el=document.getElementById("xhsTip");
  if(!el)return;
  el.textContent=msg;
  el.style.display="block";
  clearTimeout(window.__xhsTipTimer);
  window.__xhsTipTimer=setTimeout(function(){el.style.display="none";},2600);
}
var API="/api/xhs";
var curStatus="";
var XHS_BIZ=new URLSearchParams(window.location.search).get("business")||"";
var XHS_ACCOUNT=null;

function loadAccount(){
  var url=API+"/accounts"+(XHS_BIZ?("?business="+encodeURIComponent(XHS_BIZ)):"");
  fetch(url).then(function(r){return r.json()}).then(function(d){
    var accounts=d.accounts||[];
    XHS_ACCOUNT=accounts[0]||null;
    var box=document.getElementById("xhsAccount");
    if(!box)return;
    if(!XHS_BIZ){box.innerHTML="\u5f53\u524d\u67e5\u770b\uff1a\u5168\u90e8\u4e1a\u52a1 \u00b7 \u53d1\u5e03\u65f6\u4f1a\u6309\u8349\u7a3f business \u6821\u9a8c\u8d26\u53f7";return}
    if(!XHS_ACCOUNT){box.innerHTML="\u5f53\u524d\u4e1a\u52a1\uff1a"+esc(XHS_BIZ)+" \u00b7 \u672a\u914d\u7f6e\u5c0f\u7ea2\u4e66\u8d26\u53f7";return}
    var ok=XHS_ACCOUNT.enabled&&XHS_ACCOUNT.has_publish_channel;
    box.innerHTML="\u5f53\u524d\u4e1a\u52a1\uff1a"+esc(XHS_ACCOUNT.display_name||XHS_BIZ)+" \u00b7 \u5c0f\u7ea2\u4e66\u8d26\u53f7\uff1a"+esc(XHS_ACCOUNT.account_label||"\u672a\u547d\u540d")+" \u00b7 "+(ok?"<b style='color:#2e7d32'>\u5df2\u7ed1\u5b9a</b>":"<b style='color:#c62828'>\u672a\u7ed1\u5b9a\u53d1\u5e03\u901a\u9053</b>");
  }).catch(function(){xhsTip("\u8d26\u53f7\u72b6\u6001\u52a0\u8f7d\u5931\u8d25")});
}

function openXhsTool(name){
  var panel=document.getElementById("xhsToolPanel");
  if(!panel)return;
  panel.style.display="block";
  if(name==="research"){
    panel.innerHTML='<div style="font-weight:600;margin-bottom:8px">\u7206\u6b3e\u8c03\u7814</div><div style="font-size:12px;color:#777;margin-bottom:8px">\u8c03\u7814\u53ef\u5171\u7528\uff0c\u641c\u7d22\u65f6\u4f1a\u5e26\u5f53\u524d\u4e1a\u52a1\u9009\u9879\u3002\u8c03\u7814\u7ed3\u679c\u7528\u6765\u53cd\u63a8\u9009\u9898\u548c\u6a21\u677f\uff0c\u4e0d\u81ea\u52a8\u53d1\u5e03\u3002</div><div style="display:flex;gap:6px"><input id="xhsResearchKw" placeholder="\u5173\u952e\u8bcd\uff0c\u5982 CSLB \u5907\u8003 / \u6d74\u5ba4\u67dc / \u5bb6\u5177" style="flex:1;padding:9px;border:1px solid #ddd;border-radius:8px"><button onclick="doXhsResearch()" style="padding:9px 12px;border:0;border-radius:8px;background:#e91e63;color:#fff">\u641c\u7d22</button></div><div id="xhsResearchOut" style="margin-top:10px;font-size:12px;color:#555;white-space:pre-wrap;max-height:260px;overflow:auto"></div>';
    return;
  }
  if(name==="content"){
    setDraftStatus("");
    panel.innerHTML='<div style="font-weight:600;margin-bottom:8px">\u5185\u5bb9\u751f\u6210</div><div style="font-size:12px;color:#777;margin-bottom:8px">\u8fd9\u91cc\u5c55\u793a\u5df2\u7531 SEO V4 \u6587\u7ae0\u751f\u6210\u7684\u5c0f\u7ea2\u4e66\u5185\u5bb9\u3002\u53ef\u4ee5\u70b9\u8be6\u60c5\u770b\u56fe\u7247\uff0c\u70b9\u7f16\u8f91\u4fee\u6539\u6587\u6848\u548c\u6807\u7b7e\u3002</div><button class="xhs-tab on" onclick="setDraftStatus(\'\')">\u5168\u90e8\u5185\u5bb9</button> <button class="xhs-tab" onclick="setDraftStatus(\'pending\')">\u5f85\u53d1\u5e03</button>';
    return;
  }
  if(name==="publish"){
    setDraftStatus("pending");
    panel.innerHTML='<div style="font-weight:600;margin-bottom:8px">\u53d1\u5e03\u4e2d\u5fc3</div><div style="font-size:12px;color:#777;margin-bottom:8px">\u8fd9\u91cc\u5904\u7406\u5f85\u53d1\u3001\u5df2\u53d1\u3001\u5931\u8d25\u7684\u8349\u7a3f\u3002\u53d1\u5e03\u524d\u7cfb\u7edf\u4f1a\u6821\u9a8c business \u548c\u5df2\u7ed1\u5b9a\u8d26\u53f7\u3002</div><button class="xhs-tab on" onclick="setDraftStatus(\'pending\')">\u5f85\u53d1\u5e03</button> <button class="xhs-tab" onclick="setDraftStatus(\'published\')">\u5df2\u53d1\u5e03</button> <button class="xhs-tab" onclick="setDraftStatus(\'failed\')">\u5931\u8d25</button>';
    return;
  }
  if(name==="account"){
    loadAccount();
    panel.innerHTML='<div style="font-weight:600;margin-bottom:8px">\u8d26\u53f7\u7ba1\u7406</div><div style="font-size:12px;color:#777">Oaklian \u6cbf\u7528\u73b0\u6709\u53d1\u5e03\u901a\u9053\u3002JNONO / Pricvo / Recossi \u672a\u7ed1\u5b9a\u65f6\u4f1a\u963b\u6b62\u53d1\u5e03\uff0c\u9632\u6b62\u8bef\u53d1\u5230\u522b\u7684\u4e1a\u52a1\u8d26\u53f7\u3002</div>';
    return;
  }
  if(name==="engage"){
    setDraftStatus("published");
    panel.innerHTML='<div style="font-weight:600;margin-bottom:8px">\u4e92\u52a8\u7ba1\u7406</div><div style="font-size:12px;color:#777;margin-bottom:8px">\u8fd9\u91cc\u6309\u5df2\u53d1\u5e03\u7b14\u8bb0\u505a\u4eba\u5de5\u8ddf\u8fdb\u3002\u771f\u5b9e\u9605\u8bfb\u3001\u6536\u85cf\u3001\u8bc4\u8bba\u9700\u8981\u540e\u7eed\u63a5\u5165\u6216\u624b\u52a8\u8bb0\u5f55\u3002</div><div id="xhsEngageOut">\u52a0\u8f7d\u4e2d...</div>';
    renderEngagePanel();
    return;
  }
  if(name==="analytics"){
    panel.innerHTML='<div style="font-weight:600;margin-bottom:8px">\u6570\u636e\u5206\u6790</div><div id="xhsAnalyticsOut" style="font-size:12px;color:#555">\u52a0\u8f7d\u4e2d...</div>';
    renderXhsAnalytics();
  }
}

function doXhsResearch(){
  var kw=(document.getElementById("xhsResearchKw")||{}).value||"";
  var out=document.getElementById("xhsResearchOut");
  if(!kw.trim()){if(out)out.textContent="\u5148\u8f93\u5165\u5173\u952e\u8bcd";return}
  if(out)out.textContent="\u8c03\u7814\u4e2d...";
  fetch(API+"/research/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({keyword:kw,business:XHS_BIZ})}).then(function(r){return r.json()}).then(function(d){
    if(out)out.textContent=JSON.stringify(d,null,2).slice(0,6000);
  }).catch(function(e){if(out)out.textContent="\u8c03\u7814\u5931\u8d25: "+e});
}

function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function stLabel(s){return{pending:"待发布",published:"已发布",failed:"失败",discarded:"已删除"}[s]||s}
function fmtDate(d){if(!d)return"-";var x=new Date(d);return x.getFullYear()+"-"+("0"+(x.getMonth()+1)).slice(-2)+"-"+("0"+x.getDate()).slice(-2)+" "+("0"+x.getHours()).slice(-2)+":"+("0"+x.getMinutes()).slice(-2)}


function setDraftStatus(status){
  curStatus=status;
  var tabs=document.getElementById("tabs").getElementsByClassName("xhs-tab");
  for(var i=0;i<tabs.length;i++){
    tabs[i].classList.toggle("on", tabs[i].getAttribute("data-s")===status);
  }
  loadStats();
  loadList();
}

function sourceArticleLink(id){
  return id ? '<a href="/static/article.html?id='+id+'" style="color:#2196f3;text-decoration:none">\u6e90\u6587\u7ae0 #'+id+'</a>' : '';
}

function renderXhsAnalytics(){
  var box=document.getElementById("xhsAnalyticsOut");
  fetch(API+"/overview"+(XHS_BIZ?("?business="+encodeURIComponent(XHS_BIZ)):"")).then(function(r){return r.json()}).then(function(d){
    var counts={};
    (d.counts||[]).forEach(function(x){counts[x.status]=(counts[x.status]||0)+x.count});
    var html='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px">';
    html+='<div class="xhs-st">\u5f85\u53d1 '+(counts.pending||0)+'</div>';
    html+='<div class="xhs-st published">\u5df2\u53d1 '+(counts.published||0)+'</div>';
    html+='<div class="xhs-st failed">\u5931\u8d25 '+(counts.failed||0)+'</div></div>';
    html+='<div style="font-weight:600;margin:8px 0 6px">\u6700\u8fd1\u5185\u5bb9</div>';
    if(!(d.latest||[]).length){html+='\u6682\u65e0\u6570\u636e';}
    (d.latest||[]).forEach(function(x){html+='<div style="padding:7px 0;border-top:1px solid #eee"><b>#'+x.id+'</b> '+esc(x.title)+' <span style="color:#999">'+stLabel(x.status)+'</span><br>'+sourceArticleLink(x.source_article_id)+'</div>';});
    box.innerHTML=html;
  }).catch(function(e){box.textContent='\u6570\u636e\u52a0\u8f7d\u5931\u8d25: '+e});
}

function renderEngagePanel(){
  var box=document.getElementById("xhsEngageOut");
  fetch(API+"/drafts?status=published"+(XHS_BIZ?("&business="+encodeURIComponent(XHS_BIZ)):"")).then(function(r){return r.json()}).then(function(d){
    var arr=d.drafts||[];
    if(!arr.length){box.innerHTML='\u6682\u65e0\u5df2\u53d1\u5e03\u7b14\u8bb0\uff0c\u53d1\u5e03\u540e\u4f1a\u5728\u8fd9\u91cc\u505a\u4eba\u5de5\u8ddf\u8fdb\u3002';return}
    var html='';
    arr.forEach(function(x){html+='<div style="padding:8px 0;border-top:1px solid #eee"><b>#'+x.id+'</b> '+esc(x.title)+'<br><span style="color:#999">\u5df2\u53d1\u5e03 '+fmtDate(x.published_at||x.updated_at)+'</span></div>';});
    box.innerHTML=html;
  }).catch(function(e){box.textContent='\u52a0\u8f7d\u5931\u8d25: '+e});
}

function loadStats(){
  fetch(API+"/stats"+(XHS_BIZ?("?business="+encodeURIComponent(XHS_BIZ)):"")).then(function(r){return r.json()}).then(function(d){
    document.getElementById("stats").textContent="总 "+(d.total||0)+" · 待发 "+(d.pending||0)+" · 已发 "+(d.published||0)+" · 失败 "+(d.failed||0);
  }).catch(function(){});
}

function loadList(){
  var url=API+"/drafts?"+(curStatus?("status="+curStatus+"&"):"")+(XHS_BIZ?("business="+XHS_BIZ):"");
  document.getElementById("list").innerHTML='<div class="xhs-empty">加载中…</div>';
  fetch(url).then(function(r){return r.json()}).then(function(d){
    var arr=d.drafts||[];
    if(!arr.length){document.getElementById("list").innerHTML='<div class="xhs-empty">暂无草稿</div>';return}
    var html="";
    for(var i=0;i<arr.length;i++){
      var x=arr[i];
      var canPub=(x.status==="pending");
      html+='<div class="xhs-card '+x.status+'">';
      html+='<div class="xhs-card-top"><span class="xhs-id">#'+x.id+'</span><span class="xhs-st '+x.status+'">'+stLabel(x.status)+'</span></div>';
      html+='<div class="xhs-title">'+esc(x.title)+'</div>';
      html+='<div class="xhs-body">'+esc(x.body)+'</div>';
      html+='<div class="xhs-meta">'+fmtDate(x.updated_at)+' \u00b7 '+esc(x.business||'')+' \u00b7 '+(x.tags?x.tags.length:0)+' \u6807\u7b7e '+sourceArticleLink(x.source_article_id)+'</div>';
      html+='<div class="xhs-acts">';
      html+='<button class="xhs-btn v" onclick="viewDraft('+x.id+')">详情</button>';
      html+='<button class="xhs-btn e" onclick="editDraft('+x.id+')"'+(canPub?"":" disabled style=opacity:.4")+'>编辑</button>';
      html+='<button class="xhs-btn p" onclick="pubDraft('+x.id+')"'+(canPub?"":" disabled style=opacity:.4")+'>发布</button>';
      html+='</div></div>';
    }
    document.getElementById("list").innerHTML=html;
  }).catch(function(e){
    document.getElementById("list").innerHTML='<div class="xhs-empty">加载失败: '+e+'</div>';
  });
}

function viewDraft(id){
  fetch(API+"/drafts/"+id).then(function(r){return r.json()}).then(function(d){
    var tags="";
    if(d.tags)for(var i=0;i<d.tags.length;i++)tags+='<span class="xhs-tag">'+esc(d.tags[i])+'</span>';
    var h='<h3>草稿 #'+d.id+'</h3>';
    h+='<div class="row"><div class="lbl">标题</div><div class="val" style="font-weight:600">'+esc(d.title)+'</div></div>';
    h+='<div class="row"><div class="lbl">正文</div><div class="val">'+esc(d.body)+'</div></div>';
    h+='<div class="row"><div class="lbl">标签</div><div>'+tags+'</div></div>';
    h+='<div class="row"><div class="lbl">图片</div><div id="xhs_imgs">加载中…</div></div>';
    h+='<div class="row"><div class="lbl">状态</div><div class="val">'+stLabel(d.status)+'</div></div>';
    h+='<div class="row"><div class="lbl">时间</div><div class="val" style="font-size:12px;color:#999">创建 '+fmtDate(d.created_at)+'<br>更新 '+fmtDate(d.updated_at)+(d.published_at?'<br>发布 '+fmtDate(d.published_at):'')+'</div></div>';
    h+='<button class="xhs-close" onclick="closeModal()">关闭</button>';
    document.getElementById("modalContent").innerHTML=h;
    document.getElementById("modal").classList.add("on");
    fetch(API+"/drafts/"+id+"/images").then(function(r){return r.json()}).then(function(im){
      var box=document.getElementById("xhs_imgs");
      if(!box)return;
      if(!im.images||!im.images.length){box.textContent="（无图片）";return}
      var ih="";
      for(var k=0;k<im.images.length;k++){
        ih+='<img src="'+API+'/image/'+im.article_id+'/'+im.images[k]+'" onclick="openImgViewer(this.src)" style="width:80px;height:80px;object-fit:cover;border-radius:6px;margin:2px 6px 2px 0;border:1px solid #ddd;cursor:pointer">';
      }
      box.innerHTML=ih;
    }).catch(function(){var b=document.getElementById("xhs_imgs");if(b)b.textContent="图片加载失败"});
  });
}

function editDraft(id){
  fetch(API+"/drafts/"+id).then(function(r){return r.json()}).then(function(d){
    var h='<h3>编辑草稿 #'+d.id+'</h3>';
    h+='<div class="row"><div class="lbl">标题（小红书限20字）</div><input id="ed_title" value="'+esc(d.title)+'" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px;box-sizing:border-box"></div>';
    h+='<div class="row"><div class="lbl">正文（限1000字）</div><textarea id="ed_body" style="width:100%;min-height:200px;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px;box-sizing:border-box;line-height:1.6">'+esc(d.body)+'</textarea></div>';
    h+='<div class="row"><div class="lbl">标签（逗号分隔）</div><input id="ed_tags" value="'+esc((d.tags||[]).join(", "))+'" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px;box-sizing:border-box"></div>';
    h+='<div class="row"><div class="lbl">图片 <span id="ed_imgcount"></span></div><div id="ed_imgbox">加载中…</div><input type="file" id="ed_imgfile" accept="image/jpeg,image/png" style="display:none" onchange="doUpload('+d.id+')"><button type="button" onclick="document.getElementById(\'ed_imgfile\').click()" style="width:100%;padding:10px;margin-top:8px;border:1px dashed #e91e63;border-radius:6px;background:#fff;color:#e91e63;font-size:14px;cursor:pointer">＋ 上传图片</button></div>';
    h+='<button class="xhs-close" style="background:#e91e63;color:#fff" onclick="saveDraft('+d.id+')">保存</button>';
    h+='<button class="xhs-close" onclick="closeModal()">取消</button>';
    document.getElementById("modalContent").innerHTML=h;
    document.getElementById("modal").classList.add("on");
    window._edDraftId=d.id;
    loadEditImages(d.id);
  });
}

function loadEditImages(id){
  fetch(API+"/drafts/"+id+"/images").then(function(r){return r.json()}).then(function(im){
    var box=document.getElementById("ed_imgbox");
    var cnt=document.getElementById("ed_imgcount");
    if(!box)return;
    var imgs=im.images||[];
    if(cnt)cnt.textContent="("+imgs.length+"/9)";
    if(!imgs.length){box.textContent="（无图片）";return}
    var ih="";
    for(var k=0;k<imgs.length;k++){
      var fn=imgs[k];
      ih+='<div style="display:inline-block;position:relative;margin:2px 6px 2px 0">';
      ih+='<img src="'+API+'/image/'+im.article_id+'/'+fn+'" onclick="openImgViewer(this.src)" style="width:80px;height:80px;object-fit:cover;border-radius:6px;border:1px solid #ddd;cursor:pointer">';
      ih+='<button type="button" onclick="delEditImage('+im.article_id+',\''+fn+'\','+id+')" style="position:absolute;top:-6px;right:-2px;width:22px;height:22px;border-radius:50%;border:none;background:#f44336;color:#fff;font-size:14px;line-height:1;cursor:pointer">×</button>';
      ih+='</div>';
    }
    box.innerHTML=ih;
  }).catch(function(){var b=document.getElementById("ed_imgbox");if(b)b.textContent="图片加载失败"});
}

function delEditImage(artId,fn,draftId){
  if(!confirm("删除这张图片？"))return;
  fetch(API+"/image/"+artId+"/"+fn,{method:"DELETE"}).then(function(r){
    if(!r.ok)return r.text().then(function(t){throw new Error(t)});
    return r.json();
  }).then(function(){
    loadEditImages(draftId);
  }).catch(function(e){alert("删除失败: "+e.message)});
}

function doUpload(draftId){
  var fi=document.getElementById("ed_imgfile");
  if(!fi||!fi.files||!fi.files.length)return;
  var fd=new FormData();
  fd.append("file",fi.files[0]);
  var box=document.getElementById("ed_imgbox");
  if(box)box.innerHTML="上传中…";
  fetch(API+"/drafts/"+draftId+"/upload",{method:"POST",body:fd}).then(function(r){
    if(!r.ok)return r.text().then(function(t){throw new Error(t)});
    return r.json();
  }).then(function(){
    fi.value="";
    loadEditImages(draftId);
  }).catch(function(e){
    alert("上传失败: "+e.message);
    loadEditImages(draftId);
  });
}

function saveDraft(id){
  var title=document.getElementById("ed_title").value;
  var body=document.getElementById("ed_body").value;
  var tagsRaw=document.getElementById("ed_tags").value;
  var tags=tagsRaw.split(",").map(function(t){return t.trim()}).filter(function(t){return t});
  if(title.length>20){alert("标题 "+title.length+" 字，超过小红书 20 字上限");return}
  if(body.length>1000){alert("正文 "+body.length+" 字，超过 1000 字上限");return}
  fetch(API+"/drafts/"+id,{
    method:"PUT",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({title:title,body:body,tags:tags})
  }).then(function(r){
    if(!r.ok)return r.text().then(function(t){throw new Error(t)});
    return r.json();
  }).then(function(){
    closeModal();
    loadStats();
    loadList();
    alert("✅ 已保存");
  }).catch(function(e){
    alert("❌ 保存失败: "+e.message);
  });
}

function pubDraft(id){
  if(!confirm("确认发布草稿 #"+id+" 到小红书？\n\n这会真实发布到你的小红书账号。"))return;
  var btns=document.querySelectorAll(".xhs-btn.p");
  for(var i=0;i<btns.length;i++)btns[i].textContent="发布中…";
  fetch(API+"/drafts/"+id+"/publish",{method:"POST"})
    .then(function(r){return r.json()})
    .then(function(d){
      if(d.status==="success"){
        alert("✅ 发布成功！");
      }else{
        alert("❌ 发布失败:\n"+(d.message||"未知错误"));
      }
      loadStats();
      loadList();
    }).catch(function(e){
      alert("❌ 请求失败: "+e.message);
      loadList();
    });
}

function closeModal(){document.getElementById("modal").classList.remove("on")}

function openImgViewer(src){
  var v=document.getElementById("imgViewer");
  document.getElementById("imgViewerImg").src=src;
  v.style.display="flex";
}
function closeImgViewer(){
  document.getElementById("imgViewer").style.display="none";
}

document.getElementById("modal").addEventListener("click",function(e){
  if(e.target.id==="modal")closeModal();
});

var tabs=document.getElementById("tabs").getElementsByClassName("xhs-tab");
for(var i=0;i<tabs.length;i++){
  tabs[i].addEventListener("click",function(e){
    for(var j=0;j<tabs.length;j++)tabs[j].classList.remove("on");
    e.target.classList.add("on");
    curStatus=e.target.getAttribute("data-s");
    loadList();
  });
}

loadAccount();
loadStats();
loadList();
</script>
</body>
</html>
