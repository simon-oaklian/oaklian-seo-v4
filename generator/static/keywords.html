<script>
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function bizLabel(b) {
  return {oaklian:'Oaklian', jnono:'jnono', pricvo:'Pricvo', recossi:'Recossi'}[b] || b;
}

const state = {
  tab: 'today',
  biz: new URLSearchParams(location.search).get('biz') || ''
};

function setQueryBiz() {
  const sel = document.getElementById('biz-filter');
  if (state.biz) sel.value = state.biz;
}

function groupByBiz(items) {
  const groups = {};
  for (const it of items) {
    const b = it.business || 'other';
    if (!groups[b]) groups[b] = [];
    groups[b].push(it);
  }
  return groups;
}

function renderTodayItem(it) {
  /* SPRINT_2K1D_DISMISS_BTN */
  const badges = [];
  if (it.is_breakout) badges.push('<span class="kw-badge breakout">🔥 突发</span>');
  if (it.is_rising) badges.push('<span class="kw-badge rising">↑ 上升</span>');
  if (it.search_volume) badges.push('<span class="kw-badge vol">'+esc(it.search_volume)+'/月</span>');
  return '<div class="kw-item" data-cand-id="'+it.id+'"><div class="kw-text">'+esc(it.keyword)+
         '<div class="kw-meta">'+esc(it.source||'')+' · '+esc(it.fetched_date||'')+'</div>'+
         '</div><div class="kw-badges">'+badges.join('')+
         '<button class="kw-write" data-kw="'+esc(it.keyword)+'" data-biz="'+esc(it.business||'')+'" title="用此词写文章" aria-label="用此词写文章">✍</button>'+
         '<button class="kw-dismiss" data-cand-id="'+it.id+'" title="剔除" aria-label="剔除">✕</button>'+
         '</div></div>';
}

function renderAggItem(it) {
  const badges = [];
  badges.push('<span class="kw-badge count">×'+it.appearances+'</span>');
  if (it.ever_breakout) badges.push('<span class="kw-badge breakout">🔥</span>');
  if (it.ever_rising) badges.push('<span class="kw-badge rising">↑</span>');
  if (it.max_volume) badges.push('<span class="kw-badge vol">'+esc(it.max_volume)+'/月</span>');
  return '<div class="kw-item"><div class="kw-text">'+esc(it.keyword)+
         '<div class="kw-meta">最近: '+esc(it.last_seen||'')+'</div>'+
         '</div><div class="kw-badges">'+badges.join('')+
         '<button class="kw-write" data-kw="'+esc(it.keyword)+'" data-biz="'+esc(it.business||'')+'" title="用此词写文章" aria-label="用此词写文章">✍</button>'+
         '</div></div>';
}

function renderHistItem(it) {
  const badges = [];
  if (it.is_breakout) badges.push('<span class="kw-badge breakout">🔥</span>');
  if (it.is_rising) badges.push('<span class="kw-badge rising">↑</span>');
  if (it.search_volume) badges.push('<span class="kw-badge vol">'+esc(it.search_volume)+'</span>');
  return '<div class="kw-item"><div class="kw-text">'+esc(it.keyword)+
         '<div class="kw-meta">'+esc(it.fetched_date||'')+' · '+esc(it.source||'')+'</div>'+
         '</div><div class="kw-badges">'+badges.join('')+
         '<button class="kw-write" data-kw="'+esc(it.keyword)+'" data-biz="'+esc(it.business||'')+'" title="用此词写文章" aria-label="用此词写文章">✍</button>'+
         '</div></div>';
}

function renderGrouped(items, renderItem) {
  if (!items.length) {
    return '<div class="empty">暂无数据</div>';
  }
  const groups = groupByBiz(items);
  return Object.keys(groups).map(b =>
    '<div class="kw-group"><div class="kw-group-title">'+esc(bizLabel(b))+' · '+groups[b].length+'</div>'+
    groups[b].map(renderItem).join('')+
    '</div>'
  ).join('');
}

async function loadToday() {
  const content = document.getElementById('content');
  content.innerHTML = '<div class="empty">加载中…</div>';
  const url = '/api/keywords/today' + (state.biz ? '?business='+encodeURIComponent(state.biz) : '');
  try {
    const r = await fetch(url, {credentials:'same-origin'});
    if (!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    content.innerHTML = renderGrouped(d.items || [], renderTodayItem);
  } catch (e) {
    content.innerHTML = '<div class="empty">加载失败: '+esc(e.message)+'</div>';
  }
}

async function loadWeek() {
  const content = document.getElementById('content');
  content.innerHTML = '<div class="empty">加载中…</div>';
  const url = '/api/keywords/aggregate?window=week' + (state.biz ? '&business='+encodeURIComponent(state.biz) : '');
  try {
    const r = await fetch(url, {credentials:'same-origin'});
    if (!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    content.innerHTML = renderGrouped(d.items || [], renderAggItem);
  } catch (e) {
    content.innerHTML = '<div class="empty">加载失败: '+esc(e.message)+'</div>';
  }
}

async function loadHistory() {
  const content = document.getElementById('content');
  content.innerHTML = '<div class="empty">加载中…</div>';
  const df = document.getElementById('date-from').value;
  const dt = document.getElementById('date-to').value;
  const params = new URLSearchParams();
  if (state.biz) params.set('business', state.biz);
  if (df) params.set('date_from', df);
  if (dt) params.set('date_to', dt);
  const url = '/api/keywords/history' + (params.toString() ? '?'+params.toString() : '');
  try {
    const r = await fetch(url, {credentials:'same-origin'});
    if (!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    content.innerHTML = renderGrouped(d.items || [], renderHistItem);
  } catch (e) {
    content.innerHTML = '<div class="empty">加载失败: '+esc(e.message)+'</div>';
  }
}

/* === SPRINT_2K1D_DISMISS_BTN BEGIN === */
async function dismissCandidate(id, btn) {
  if (!id) return;
  const card = btn.closest('.kw-item');
  btn.disabled = true;
  try {
    const r = await fetch('/api/keywords/dismiss/' + encodeURIComponent(id), {
      method: 'POST',
      credentials: 'same-origin'
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    if (card) {
      card.classList.add('kw-dismissing');
      setTimeout(() => { if (card.parentNode) card.parentNode.removeChild(card); }, 240);
    }
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '✕';
    alert('剔除失败: ' + e.message);
  }
}
document.addEventListener('click', function(ev) {
  const b = ev.target.closest('.kw-dismiss');
  if (!b) return;
  ev.preventDefault();
  ev.stopPropagation();
  const id = b.getAttribute('data-cand-id');
  dismissCandidate(id, b);
});
/* === SPRINT_2K1D_DISMISS_BTN END === */

/* === SPRINT_2L1B_WRITE_BTN BEGIN === */
document.addEventListener('click', function(ev) {
  const b = ev.target.closest('.kw-write');
  if (!b) return;
  ev.preventDefault();
  ev.stopPropagation();
  const kw = b.getAttribute('data-kw') || '';
  const biz = b.getAttribute('data-biz') || '';
  if (kw) {
    try {
      sessionStorage.setItem('seo_v4_primary_keyword', kw);
      if (biz) sessionStorage.setItem('seo_v4_primary_business_hint', biz);
    } catch (e) { /* sessionStorage may fail in private mode; we proceed */ }
  }
  window.location.href = '/static/new.html';
});
/* === SPRINT_2L1B_WRITE_BTN END === */

function setTab(name) {
  state.tab = name;
  document.querySelectorAll('.kw-tabs button').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-tab') === name);
  });
  document.getElementById('filterbar').classList.toggle('history-mode', name === 'history');
  if (name === 'today') loadToday();
  else if (name === 'week') loadWeek();
  else if (name === 'history') loadHistory();
}

document.querySelectorAll('.kw-tabs button').forEach(b => {
  b.addEventListener('click', () => setTab(b.getAttribute('data-tab')));
});
document.getElementById('biz-filter').addEventListener('change', (e) => {
  state.biz = e.target.value;
  setTab(state.tab);
});
['date-from','date-to'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => {
    if (state.tab === 'history') loadHistory();
  });
});

(function initDates() {
  const today = new Date();
  const ago = new Date(Date.now() - 30*86400000);
  const fmt = d => d.toISOString().slice(0,10);
  document.getElementById('date-from').value = fmt(ago);
  document.getElementById('date-to').value = fmt(today);
})();

setQueryBiz();
setTab('today');

// sprint2k1c-a4: schedule control panel logic
(function(){
  const BIZ_LABEL = {oaklian:'Oaklian', pricvo:'Pricvo', recossi:'Recossi'};
  const MODE_LABEL = {manual:'手动', weekly:'每周', monthly:'每月'};
  const panel = document.getElementById('sched-panel');
  const toggle = document.getElementById('sched-toggle');
  const body = document.getElementById('sched-body');
  const toast = document.getElementById('sched-toast');
  let scheduleData = [];

  function fmtRelative(iso) {
    if (!iso) return '从未';
    const now = new Date();
    const then = new Date(iso);
    const sec = Math.floor((now - then) / 1000);
    if (sec < 60) return '刚刚';
    if (sec < 3600) return Math.floor(sec/60) + ' 分钟前';
    if (sec < 86400) return Math.floor(sec/3600) + ' 小时前';
    if (sec < 86400*30) return Math.floor(sec/86400) + ' 天前';
    return Math.floor(sec/86400/30) + ' 月前';
  }

  function showToast(msg, isError) {
    toast.textContent = msg;
    toast.className = 'sched-toast show' + (isError ? ' error' : '');
    setTimeout(function(){ toast.className = 'sched-toast'; }, 2200);
  }

  function renderRows(items) {
    if (!items.length) { body.innerHTML = '<div class="empty">无业务配置</div>'; return; }
    body.innerHTML = items.map(function(it){
      const label = BIZ_LABEL[it.business] || it.business;
      const lastTxt = fmtRelative(it.last_run_at);
      const pending = it.trigger_pending;
      const opts = ['manual','weekly','monthly'].map(function(m){
        return '<option value="'+m+'"'+(it.mode===m?' selected':'')+'>'+MODE_LABEL[m]+'</option>';
      }).join('');
      return '<div class="sched-row" data-biz="'+it.business+'">'
        + '<span class="sched-biz">'+label+'</span>'
        + '<select class="sched-mode">'+opts+'</select>'
        + '<span class="sched-last">'+lastTxt+'</span>'
        + '<button class="sched-trigger'+(pending?' queued':'')+'"'+(pending?' disabled':'')+'>'
        + (pending?'已排队':'立即抓取')+'</button>'
        + '</div>'
        + '<div class="seed-row" data-biz="'+it.business+'">'
        +   '<div class="seed-row-head">'
        +     '<span>种子词 <span class="seed-count" data-biz-count="'+it.business+'">…</span></span>'
        +     '<span class="caret">▼</span>'
        +   '</div>'
        +   '<div class="seed-row-body">'
        +     '<div class="seed-list" data-biz-list="'+it.business+'"><span class="seed-empty">加载中…</span></div>'
        +     '<div class="seed-add">'
        +       '<input type="text" placeholder="新增种子词,如 heat pump rebate" maxlength="100">'
        +       '<button class="seed-add-btn">添加</button>'
        +     '</div>'
        +     '<div class="seed-probe" data-biz-probe="'+it.business+'" style="display:none"></div>'
        +   '</div>'
        + '</div>';
    }).join('');
    // wire change/click events
    body.querySelectorAll('.sched-row').forEach(function(row){
      const biz = row.getAttribute('data-biz');
      const sel = row.querySelector('.sched-mode');
      const btn = row.querySelector('.sched-trigger');
      sel.addEventListener('change', function(){
        const mode = sel.value;
        fetch('/api/schedule/'+encodeURIComponent(biz), {
          method:'PUT',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({mode: mode})
        }).then(function(r){ return r.ok ? r.json() : r.json().then(function(j){ throw new Error(j.detail||'更新失败'); }); })
          .then(function(){ showToast(BIZ_LABEL[biz]+' 已设为 '+MODE_LABEL[mode]); })
          .catch(function(e){ showToast('更新失败: '+e.message, true); });
      });
      btn.addEventListener('click', function(){
        if (btn.classList.contains('queued')) return;
        fetch('/api/keywords/trigger/'+encodeURIComponent(biz), {method:'POST'})
          .then(function(r){ return r.ok ? r.json() : r.json().then(function(j){ throw new Error(j.detail||'排队失败'); }); })
          .then(function(){
            btn.classList.add('queued');
            btn.disabled = true;
            btn.textContent = '已排队';
            showToast(BIZ_LABEL[biz]+' 已排队 · ~1 分钟内开始抓取');
          })
          .catch(function(e){ showToast('排队失败: '+e.message, true); });
      });
      wireSeedRow(row, biz);
    });
  }

  function wireSeedRow(row, biz) {
    const seedRow = row.parentNode.querySelector('.seed-row[data-biz="'+biz+'"]');
    if (!seedRow) return;
    const head = seedRow.querySelector('.seed-row-head');
    const listEl = seedRow.querySelector('.seed-list');
    const countEl = seedRow.querySelector('.seed-count');
    const probeEl = seedRow.querySelector('.seed-probe');
    const input = seedRow.querySelector('.seed-add input');
    const addBtn = seedRow.querySelector('.seed-add-btn');
    let loaded = false;
    head.addEventListener('click', function(){
      seedRow.classList.toggle('open');
      if (seedRow.classList.contains('open') && !loaded) {
        loaded = true;
        loadSeeds();
      }
    });
    function loadSeeds() {
      fetch('/api/seed-keywords/'+encodeURIComponent(biz), {credentials:'same-origin'})
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(d){
          if (!d) { listEl.innerHTML = '<span class="seed-empty">加载失败</span>'; return; }
          countEl.textContent = '('+d.count+')';
          if (!d.items.length) { listEl.innerHTML = '<span class="seed-empty">暂无种子词</span>'; return; }
          listEl.innerHTML = d.items.map(function(it){
            return '<span class="seed-chip" data-id="'+it.id+'">'
              + '<span class="seed-kw">'+escHtml(it.keyword)+'</span>'
              + '<span class="seed-test" title="试抓">🧪</span>'
              + '<span class="seed-del" title="删除">×</span>'
              + '</span>';
          }).join('');
          listEl.querySelectorAll('.seed-chip').forEach(function(chip){
            const id = chip.getAttribute('data-id');
            const kw = chip.querySelector('.seed-kw').textContent;
            chip.querySelector('.seed-del').addEventListener('click', function(){
              if (!confirm('删除种子词 "'+kw+'" ?')) return;
              fetch('/api/seed-keywords/'+encodeURIComponent(biz)+'/'+id, {method:'DELETE'})
                .then(function(r){ return r.ok ? r.json() : r.json().then(function(j){ throw new Error(j.detail||'删除失败'); }); })
                .then(function(){ showToast('已删除 '+kw); loadSeeds(); })
                .catch(function(e){ showToast('删除失败: '+e.message, true); });
            });
            chip.querySelector('.seed-test').addEventListener('click', function(){
              probeEl.style.display = 'block';
              probeEl.classList.remove('error');
              probeEl.textContent = '试抓 "'+kw+'" 中… (约 30 秒,成本约 $0.0023)';
              fetch('/api/seed-keywords/'+encodeURIComponent(biz)+'/test', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({keyword: kw})
              }).then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.detail||'试抓失败'); return j; }); })
                .then(function(d){
                  probeEl.classList.remove('error');
                  const rising = (d.rising||[]).slice(0,10);
                  const top = (d.top||[]).slice(0,10);
                  function chips(arr) {
                    if (!arr.length) return '<i>无</i>';
                    return arr.map(function(w){
                      return '<span class="probe-chip" data-kw="'+escHtml(w)+'">'+escHtml(w)+' <span class="probe-add" title="加为种子">+</span></span>';
                    }).join(' ');
                  }
                  probeEl.innerHTML = '<b>'+escHtml(kw)+'</b> 试抓结果 · 点 + 加入候选库写文章用<br>'
                    + '<div style="margin-top:6px">↑ 上升 ('+rising.length+'): ' + chips(rising) + '</div>'
                    + '<div style="margin-top:6px">★ 热门 ('+top.length+'): ' + chips(top) + '</div>';
                  probeEl.querySelectorAll('.probe-add').forEach(function(btn){
                    btn.addEventListener('click', function(e){
                      e.stopPropagation();
                      const chip = btn.closest('.probe-chip');
                      const newKw = chip.getAttribute('data-kw');
                      btn.textContent = '…';
                      fetch('/api/keywords/add-candidate/'+encodeURIComponent(biz), {
                        method:'POST',
                        headers:{'Content-Type':'application/json'},
                        body: JSON.stringify({keyword: newKw, source_seed: kw, kind: 'probe'})
                      }).then(function(r){ return r.ok ? r.json() : r.json().then(function(j){ throw new Error(j.detail||'添加失败'); }); })
                        .then(function(){
                          chip.style.opacity = '0.4';
                          btn.textContent = '✓';
                          showToast('已入候选库: '+newKw);
                        })
                        .catch(function(e){
                          btn.textContent = '+';
                          showToast('添加失败: '+e.message, true);
                        });
                    });
                  });
                })
                .catch(function(e){
                  probeEl.classList.add('error');
                  probeEl.textContent = '试抓失败: ' + e.message;
                });
            });
          });
        });
    }
    function addSeed() {
      const kw = input.value.trim();
      if (!kw) return;
      addBtn.disabled = true;
      fetch('/api/seed-keywords/'+encodeURIComponent(biz), {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({keyword: kw})
      }).then(function(r){ return r.ok ? r.json() : r.json().then(function(j){ throw new Error(j.detail||'添加失败'); }); })
        .then(function(){ input.value=''; showToast('已添加 '+kw); loadSeeds(); })
        .catch(function(e){ showToast('添加失败: '+e.message, true); })
        .finally(function(){ addBtn.disabled = false; });
    }
    addBtn.addEventListener('click', addSeed);
    input.addEventListener('keydown', function(e){ if (e.key === 'Enter') addSeed(); });
  }

  function escHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function loadSchedule() {
    fetch('/api/schedule', {credentials:'same-origin'})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if (!d || !d.items) return;
        scheduleData = d.items;
        renderRows(scheduleData);
        // Update summary chip
        const modes = scheduleData.map(function(it){
          return (BIZ_LABEL[it.business]||it.business) + ':' + (MODE_LABEL[it.mode]||it.mode);
        });
        const summary = document.getElementById('sched-summary');
        if (summary) summary.textContent = '抓取调度 · ' + modes.join(' / ');
      })
      .catch(function(){});
  }

  toggle.addEventListener('click', function(){
    panel.classList.toggle('open');
  });


  loadSchedule();
})();
</script>
</body>
</html>
