services:
  seo_db:
    image: postgres:16
    container_name: OAKLIAN-SEO-DB
    environment:
      POSTGRES_PASSWORD: <REDACTED_DB_PASSWORD>
      POSTGRES_USER: seo_user
      POSTGRES_DB: seo
    volumes:
      - seo_db:/var/lib/postgresql/data
    restart: unless-stopped

  seo_generator:
    build: ./generator
    container_name: OAKLIAN-SEO-GENERATOR
    env_file: .env
    environment:
      DATABASE_URL: postgresql://seo_user:<REDACTED_DB_PASSWORD>@seo_db:5432/seo
      OUTPUT_DIR: /site
    volumes:
      - ./generator:/app:ro
      - ./uploads:/app/static/uploads
      - ./site:/site
      - /var/www/oaklian:/oaklian:rw
    depends_on:
      - seo_db
    ports:
      - " 8001:8000\
 restart: unless-stopped

 seo_web:
 image: nginx:alpine
 container_name: OAKLIAN-SEO-WEB
 ports:
 - \8080:80\
 volumes:
 - ./site:/usr/share/nginx/html:ro
 - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
 depends_on:
 - seo_generator
 restart: unless-stopped

volumes:
 seo_db:
